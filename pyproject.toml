[project]
name = "ccacards"
version = "0.1.32"
description = "python playing cards base"
authors = [{ name = "ccdale", email = "chris.charles.allison+git@gmail.com" }]
license = { text = "GPL-3.0-or-later" }
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
	"ccaerrors>=0.1.2,<0.2.0",
	"ccalogging>=0.5.3,<0.6.0",
	"platformdirs>=4.3.6,<5.0.0",
	"pillow>=11.0.0,<12.0.0",
]

[dependency-groups]
dev = [
	"pytest>=8.3.4,<9.0.0",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"
